[project]
name = "smartcard-personalizer"
version = "0.1.0"
description = "Drive smart-card personalization scripts (.pf) over real pcsc-lite"
readme = "README.md"
authors = [
    { name = "Illia Duniaka", email = "illia@duniaka.com" }
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "enlighten>=1.10",
    "pyscard>=2.0",
]

[project.scripts]
smartcard-personalizer = "smartcard_personalizer:main"
pf-loader = "smartcard_personalizer:main"

[dependency-groups]
dev = [
    "black>=24.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
